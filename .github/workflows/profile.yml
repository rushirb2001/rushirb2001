name: profile

# Re-renders every README image from profile/profile.toml plus live GitHub data and
# deploys them to GitHub Pages. Deployments are not commits: this workflow never
# writes to the repository. README.md only links to the deployed images.
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [master]
    paths: ["profile/**", "README.md", ".github/workflows/profile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: profile/requirements.txt

      - run: pip install -r profile/requirements.txt

      - name: Render images and the README they belong to
        run: python profile/build.py --out dist --markdown "$RUNNER_TEMP/README.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check README.md matches profile.toml
        run: |
          if ! diff -u README.md "$RUNNER_TEMP/README.md"; then
            echo "::warning::README.md is out of date with profile.toml. Run: python profile/build.py --markdown README.md"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
