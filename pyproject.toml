[project]
name = "rushirb2001-widgets"
version = "0.1.0"
description = "Link-rendered SVG/PNG widgets for GitHub profile READMEs."
requires-python = ">=3.13"
dependencies = [
    "starlette==1.7.0",
    "fonttools==4.65.0",
    "brotli==1.2.0",
    "pillow==12.3.0",
    "resvg-py==0.5.0",
]

[dependency-groups]
dev = ["uvicorn==0.53.0", "pytest==9.1.1", "httpx2==2.13.1"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
