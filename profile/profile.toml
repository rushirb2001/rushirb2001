# The single source for the profile README.
# `python profile/readme.py` turns this file into README.md: every image in it is a
# link to the widget server, which renders it live. Edit here, never in README.md.

login = "rushirb2001"
service = "https://rushirb2001.vercel.app"

[hero]
eyebrow = "Founding engineer · sushrutalgs.ai"
name = "Rushir Bhavsar"
line = "RAG, physics-informed neural networks, distributed ML pipelines. Previously Cadence."
principles = ["One core, many surfaces", "Software should describe itself", "Measure before you claim"]

[languages]
# Byte counts for these are dominated by notebook outputs and markup, not code written.
skip = ["Jupyter Notebook", "HTML", "CSS"]

# Project widgets read name, description, language, stars and release live from GitHub.
# Per repo: `description` overrides a stale one, `install` shows a command, and `status`
# is auto (from topics or archival), none, or coming-soon | in-progress | beta | alpha | new.
# `layout` is cards (two per row), carousel (one card that rotates) or list (one compact card).
[open_source]
title = "Open source"
caption = "Tools you can install"
layout = "cards"

[[open_source.repos]]
repo = "cohors"
install = "brew install rushirb2001/tap/cohors"

[[open_source.repos]]
repo = "principia"
status = "coming-soon"

